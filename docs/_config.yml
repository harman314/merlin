title: Merlin
merlin_version: "0.14.0"
release_asset_prefix: merlin
release_app_name: Merlin
description: A fast, lightweight WhatsApp app for Linux, macOS, and Windows.
lang: en-US
timezone: Europe/Berlin
url: https://harman314.github.io
baseurl: "/merlin"
logo: /assets/images/logo.svg
image: /screenshot.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /screenshot.png
      topics:
        - WhatsApp client
        - Rust
        - egui
        - whatsapp-rust
        - Linux WhatsApp desktop
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /screenshot.png
      alt: Merlin showing a chat with a photo, a voice message, a quoted reply, and a link preview
    publisher:
      type: Person
      name: harman314
      url: https://github.com/harman314
      same_as:
        - https://github.com/harman314/merlin
  llms:
    title: Merlin
    description: >-
      Documentation for Merlin, a native WhatsApp client for chats, voice
      messages, attachments, and notifications on Linux, macOS, and Windows.
    full: true
    details: >-
      Covers installation, phone linking, everyday use, settings, and the
      WhatsApp connection. Source is on
      [GitHub](https://github.com/harman314/merlin).
  branding:
    site_title: Merlin
    logo:
      default: /assets/images/logo.svg
      alt: Merlin
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Merlin is a fork of <a href="https://github.com/crmne/zapfast" target="_blank" rel="noreferrer">ZapFast</a>
      by <a href="https://paolino.me" target="_blank" rel="noreferrer">Carmine Paolino</a>, under MIT.<br><span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>. Merlin is an independent project, not affiliated with or endorsed by WhatsApp LLC or Meta. WhatsApp is a trademark of WhatsApp LLC.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/harman314/merlin/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: harman314/merlin
    text: Star
    show_count: true
  github_sponsor:
    enabled: true
    user: crmne
    text: Sponsor

plugins:
  - jekyll-redirect-from
  - jekyll-vitepress-theme

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
