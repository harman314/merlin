# Shared CLI: gem install native-packages --version 0.6.0
---
schema: 1
tool:
  version: 0.6.0
  nfpm: 2.47.0
# Ubuntu 24.04 and Debian 13 use ALSA's t64 package name.
libraries:
  libasound.so.2:
    deb: libasound2t64
    rpm: alsa-lib
nfpm:
  name: merlin
  maintainer: harman314 <harman314@users.noreply.github.com>
  homepage: https://github.com/harman314/merlin
  description: Fast native WhatsApp client
  license: MIT
  provides: []
  conflicts: []
  replaces: []
  contents:
  - src: "@PAYLOAD@/merlin-v@VERSION@-@TARGET@/merlin"
    dst: "/usr/bin/merlin"
    file_info:
      mode: 493
  - src: "@PAYLOAD@/merlin-v@VERSION@-@TARGET@/LICENSE"
    dst: "/usr/share/licenses/merlin/LICENSE"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/merlin-v@VERSION@-@TARGET@/README.md"
    dst: "/usr/share/doc/merlin/README.md"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/merlin-v@VERSION@-@TARGET@/packaging/applications/merlin.desktop"
    dst: "/usr/share/applications/merlin.desktop"
    file_info:
      mode: 420
  - src: "@PAYLOAD@/merlin-v@VERSION@-@TARGET@/packaging/icons/merlin.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/merlin.svg"
    file_info:
      mode: 420
  - src: contrib/omarchy/merlin.json.tpl
    dst: /usr/share/merlin/omarchy/merlin.json.tpl
    file_info:
      mode: 420
  - src: contrib/omarchy/merlin-theme
    dst: /usr/share/merlin/omarchy/merlin-theme
    file_info:
      mode: 493
  overrides:
    deb:
      depends:
      - libc6 (>= 2.39)
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - libasound2t64
      - libasound2-plugins
      - libgcc-s1
      - libstdc++6
    rpm:
      depends:
      - glibc >= 2.39
      - libglvnd-glx
      - libglvnd-egl
      - libxkbcommon
      - libxkbcommon-x11
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libXrandr
      - alsa-lib
      - alsa-plugins-pulseaudio
      - libgcc
      - libstdc++
  rpm:
    buildhost: github-actions
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'merlin-@TAG@-macos-universal.dmg'
  linux-amd64:
    platform: linux
    arch: amd64
    libc: glibc
    compiler_target: x86_64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/merlin-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
      release_asset: merlin-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  linux-arm64:
    platform: linux
    arch: arm64
    libc: glibc
    compiler_target: aarch64-unknown-linux-gnu
    formats:
    - deb
    - rpm
    input:
      local: dist/merlin-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
      release_asset: merlin-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
release:
  repository: harman314/merlin
  checksums: checksums.txt
assets:
  AMD64:
    file: merlin-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
    local: dist/merlin-v@VERSION@-x86_64-unknown-linux-gnu.tar.gz
  ARM64:
    file: merlin-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
    local: dist/merlin-v@VERSION@-aarch64-unknown-linux-gnu.tar.gz
  MACOS:
    file: merlin-v@VERSION@-macos-universal.dmg
    local: dist/merlin-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: merlin-@VERSION@.tar.gz
    url: https://github.com/harman314/merlin/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/merlin-@VERSION@.tar.gz
templates:
  homebrew/merlin.rb: packaging/homebrew/merlin.rb.in
  arch/merlin/PKGBUILD: packaging/arch/merlin/PKGBUILD.in
  arch/merlin/merlin.install: packaging/arch/merlin.install
  arch/merlin-bin/PKGBUILD: packaging/arch/merlin-bin/PKGBUILD.in
  arch/merlin-bin/merlin-bin.install: packaging/arch/merlin.install
  arch/merlin-git/PKGBUILD: packaging/arch/merlin-git/PKGBUILD.in
  arch/merlin-git/merlin-git.install: packaging/arch/merlin.install
repositories:
  homebrew:
    url: https://github.com/harman314/homebrew-tap.git
    push_url: https://github.com/harman314/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/merlin.rb: Casks/merlin.rb
    version_file: Casks/merlin.rb
    version_pattern: 'version "([^"]+)"'
    publish: push
  aur-source:
    group: aur
    url: https://aur.archlinux.org/merlin.git
    push_url: ssh://aur@aur.archlinux.org/merlin.git
    branch: master
    package_path: "."
    files:
      arch/merlin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-bin:
    group: aur
    url: https://aur.archlinux.org/merlin-bin.git
    push_url: ssh://aur@aur.archlinux.org/merlin-bin.git
    branch: master
    package_path: "."
    files:
      arch/merlin-bin: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
  aur-git:
    group: aur
    url: https://aur.archlinux.org/merlin-git.git
    push_url: ssh://aur@aur.archlinux.org/merlin-git.git
    branch: master
    package_path: "."
    files:
      arch/merlin-git: "."
    version_file: ".SRCINFO"
    version_pattern: "^\\s*pkgver = (\\S+)"
    publish: push
version_file: Cargo.toml
